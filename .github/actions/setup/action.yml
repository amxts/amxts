# What every job of CI needs before it starts: the command and the official
# modules checked out beside the core (the folders the core's package.json and
# theirs link to, and the ones the packages carry), Node and Bun, the dependencies, the patched AssemblyScript,
# AMX Mod X and the generated API. The core itself is checked out as `amxts`
# by the job, which then runs this - on Linux, or on Windows for the Windows
# half of a release.
name: Setup
description: The core's neighbours, toolchain, dependencies and generated API

runs:
  using: composite
  steps:
    # Each neighbour versions on its own, so its release line is not the
    # core's by name (a module at 0.1.1 beside the core at 0.2.1). On a
    # release line of the core - its branch 0.N.x, a patch's tag (v0.N.M,
    # M > 0) or a pull request into 0.N.x - each neighbour is at its own
    # highest 0.N.x: the code released with the core's line. Anywhere else -
    # main, a pull request into it, a new minor's tag (v0.N.0, made on main)
    # - at its default branch: main, the next version, as the core's main;
    # on the core's next, at the neighbour's next where it has one.
    - name: The command and the official modules
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        REF: ${{ github.base_ref || github.ref_name }}
      run: |
        line=
        [[ "$REF" =~ ^([0-9]+\.[0-9]+\.x|v[0-9]+\.[0-9]+\.[1-9][0-9]*)$ ]] && line=1
        for dir in amxts-cli amxts-modules/{config-core,menu-core,resemiclip,ftp}; do
          url="https://github.com/$OWNER/${dir#amxts-modules/}"
          branch=
          [ -z "$line" ] || branch=$(git ls-remote --heads "$url" | grep -oE '[0-9]+\.[0-9]+\.x$' | sort -V | tail -n 1)
          # A branch of the core's name - next - takes the module's of that name, where it has one.
          [ -n "$line" ] || ! git ls-remote --exit-code --heads "$url" "$REF" >/dev/null || branch=$REF
          echo "$dir: ${branch:-the default branch}"
          git clone -q --depth 1 ${branch:+--branch "$branch"} "$url" "$dir"
        done

    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    # What the caches below are keyed by, besides their files: Node's exact
    # version (node-version 22 takes the newest 22.x), the day, and where this
    # system's npm keeps its downloads.
    - name: The caches' keys
      id: keys
      shell: bash
      run: |
        echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
        echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
        echo "npm-cache=$(npm config get cache)" >> "$GITHUB_OUTPUT"

    # amxxpc, AMX Mod X's Pawn compiler, is a 32-bit program. The runner's
    # image has its libraries; apt is asked only when it has not.
    - name: 32-bit libraries for amxxpc
      if: runner.os == 'Linux'
      shell: bash
      run: |
        dpkg -s libc6-i386 lib32stdc++6 lib32gcc-s1 > /dev/null 2>&1 ||
          { sudo apt-get update -qq && sudo apt-get install -y -qq libc6-i386 lib32stdc++6 lib32gcc-s1; }

    # There is no lock file (the folders are linked with --no-package-lock), so
    # an install takes the newest version each range allows that day. The
    # folders' node_modules are kept under every package.json involved, the
    # script the core's install runs, this file (the commands), the system,
    # Node and the day: a version published since is installed the next day,
    # by the first run. The links npm makes to the neighbours (`file:`,
    # @amxts/* and the command's create-amxts) are not kept - restored on
    # Windows they would be copies of the neighbours as they were - and npm
    # install, run every time, makes them again; on a hit that is all it does.
    - name: Restore node_modules
      id: modules
      uses: actions/cache/restore@v6
      with:
        path: |
          amxts/node_modules/*
          amxts-cli/node_modules/*
          amxts-modules/config-core/node_modules/*
          amxts-modules/menu-core/node_modules/*
          !**/node_modules/@amxts
          !**/node_modules/create-amxts
          !**/node_modules/.cache
        key: node-modules-${{ runner.os }}-node${{ steps.keys.outputs.node }}-${{ steps.keys.outputs.day }}-${{ hashFiles('amxts/package.json', 'amxts/packages/*/*/package.json', 'amxts-cli/package.json', 'amxts-cli/packages/*/package.json', 'amxts-modules/*/package.json', 'amxts/scripts/patch-typings.ts', 'amxts/.github/actions/setup/action.yml') }}
    # npm's download cache serves the packages of a miss, not the registry's
    # lists of versions (no --prefer-offline): a cache restored from an older
    # key would not know a version published since.
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.keys.outputs.npm-cache }}
        key: npm-${{ runner.os }}-${{ hashFiles('amxts/package.json', 'amxts-cli/package.json', 'amxts-cli/packages/*/package.json', 'amxts-modules/*/package.json') }}
        restore-keys: npm-${{ runner.os }}-
    - name: Install
      shell: bash
      run: |
        (cd amxts-cli && npm install --no-package-lock --no-audit --no-fund)
        (cd amxts && npm install --no-package-lock --no-audit --no-fund)
        # The modules' own code imports the core (@amxts/core/test-utils)
        # from their folders, which resolve it through their node_modules.
        for module in config-core menu-core; do
          (cd amxts-modules/$module && npm install --no-package-lock --no-audit --no-fund --ignore-scripts)
        done
    # Saved now, as npm left it: by the end of the job tests have written
    # into node_modules.
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          amxts/node_modules/*
          amxts-cli/node_modules/*
          amxts-modules/config-core/node_modules/*
          amxts-modules/menu-core/node_modules/*
          !**/node_modules/@amxts
          !**/node_modules/create-amxts
          !**/node_modules/.cache
        key: ${{ steps.modules.outputs.cache-primary-key }}

    # The pinned includes (ReAPI, resemiclip) as they were
    # downloaded: GitHub's release downloads fail now and then for a moment.
    - uses: actions/cache@v6
      with:
        path: amxts/includes/vendor/.download
        key: includes-${{ hashFiles('amxts/includes/sources.json') }}

    - name: Cache the patched AssemblyScript
      id: asc
      uses: actions/cache@v6
      with:
        path: amxts/runtime/deps/assemblyscript
        key: assemblyscript-0.28.20-${{ hashFiles('amxts/runtime/patches/assemblyscript-0.28.20-amxts.patch') }}
    - name: The patched AssemblyScript
      if: steps.asc.outputs.cache-hit != 'true'
      shell: bash
      working-directory: amxts
      run: |
        git clone -q --depth 1 --branch v0.28.20 https://github.com/AssemblyScript/assemblyscript runtime/deps/assemblyscript
        cd runtime/deps/assemblyscript
        git apply ../../patches/assemblyscript-0.28.20-amxts.patch
        npm install --no-audit --no-fund
        npm run build

    - name: AMX Mod X, the includes and the generated API
      shell: bash
      working-directory: amxts
      run: |
        bun run setup:amxmodx
        bun run generate
