# The core's checks, and the server's files of a release.
#
# On every push and pull request, side by side: the type check and lint; the
# test suite in three parts; and the Linux module and wamrc built in Docker,
# then the server suites on a Linux test server in Docker (bun run test:server
# --linux), on three AMX Mod X builds. On a tag v*, the Windows files are
# built too, on a Windows runner (bun run release:windows), then the nine npm
# packages are tried end to end with both systems' files (bun run
# test:release: a local registry, npx create-amxts, typecheck, build, test,
# the server image in Docker); once everything passes, both systems' files go
# to the tag's draft release (created with the version's section of
# CHANGELOG.md as its notes), and the Publish workflow is started: the draft
# taken off, the server image; the npm packages are published by hand after it
# (bun run publish:npm). Run by hand (workflow_dispatch), it builds the
# Windows files as a dry run and tries the packages - a release's rehearsal -
# and keeps the Windows files as an artifact.
#
# Every job checks the core out as `amxts` and runs .github/actions/setup,
# which puts the command and the official modules beside it. What does not
# change from run to run is cached: npm's downloads, the patched AssemblyScript,
# each test part's compiled plugins, the Docker images, the Linux build's work
# folder (wamrc and the objects of the module) and the part of LLVM that
# wamrc.exe links.
name: CI

on:
  push:
    branches: [main, next]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: amxts
      - uses: ./amxts/.github/actions/setup
      # A release's notes are its version's section of CHANGELOG.md: a tag
      # without one stops here, not after the builds.
      - name: The release's notes
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: amxts
        run: bun scripts/changelog.ts release "$GITHUB_REF_NAME" --dry-run
      - name: Type check
        working-directory: amxts
        run: bun run check
      - name: Lint
        working-directory: amxts
        run: bun run lint

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          path: amxts
      - uses: ./amxts/.github/actions/setup
      # A compiled plugin is stored under a hash of everything it was built
      # from, so an older part's cache is safe to start from: what changed is
      # compiled again, the rest is read back.
      - uses: actions/cache@v6
        with:
          path: amxts/node_modules/.cache/amxts
          key: tests-${{ matrix.part }}-${{ hashFiles('amxts/runtime/patches/**', 'amxts/as/**', 'amxts/scripts/**', 'amxts/src/**', 'amxts/tests/**') }}
          restore-keys: tests-${{ matrix.part }}-
      - name: Tests, part ${{ matrix.part }} of 3
        working-directory: amxts
        run: bun run test:part ${{ matrix.part }} 3

  # The server suites run on three AMX Mod X builds, one job each: the test
  # server image's own, and with --amxx the last of 1.9 - the oldest the docs
  # promise - and the newest of 1.10. A mistake one build lives through can
  # crash another. The Linux files come from the image's own job.
  # One more job runs them with the module under AddressSanitizer and UBSan
  # (build:linux --sanitize, test:server --sanitize): a memory error in the
  # module fails it with the file and line. It does not hold the release back
  # (continue-on-error) until it has been green for a while.
  linux:
    name: ${{ matrix.sanitize && 'linux (sanitizers)' || matrix.amxx && format('linux (AMX Mod X {0})', matrix.amxx) || 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.sanitize }}
    strategy:
      fail-fast: false
      matrix:
        amxx: ["", 1.9.0-git5303, 1.10.0-git5486]
        sanitize: [false]
        include:
          - amxx: ""
            sanitize: true
    env:
      AMXX: ${{ matrix.amxx }}
      SANITIZE: ${{ matrix.sanitize && '--sanitize' || '' }}
      # The sanitized build's folder has its own wamrc.
      AMXTS_WAMRC: ${{ matrix.sanitize && format('{0}/amxts/runtime/build/linux-sanitize/wamrc', github.workspace) || '' }}
      # The test server image's tag, and the cache of its layers.
      HLDS: amxts-hlds${{ matrix.amxx && format(':{0}', matrix.amxx) || '' }}
      HLDS_SCOPE: amxts-hlds${{ matrix.amxx && format('-{0}', matrix.amxx) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: amxts
      - uses: ./amxts/.github/actions/setup

      - uses: docker/setup-buildx-action@v4
      - name: The Linux toolchain image
        uses: docker/build-push-action@v7
        with:
          context: amxts/docker/build
          tags: amxts-build
          load: true
          cache-from: type=gha,scope=amxts-build
          cache-to: type=gha,mode=max,scope=amxts-build
      # Every build shares the layers under AMX Mod X: another build's image
      # starts from the default one's cache.
      - name: The Linux test server image
        uses: docker/build-push-action@v7
        with:
          context: amxts/docker/hlds
          tags: ${{ env.HLDS }}
          build-args: ${{ matrix.amxx && format('AMXX={0}', matrix.amxx) || '' }}
          load: true
          cache-from: |
            type=gha,scope=amxts-hlds
            type=gha,scope=${{ env.HLDS_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.HLDS_SCOPE }}

      # The build's work folder - the WAMR and AMX Mod X checkouts, wamrc and
      # the module's objects - is a folder here instead of a Docker volume,
      # so it is cached: wamrc is built again only when its inputs change.
      - uses: actions/cache@v6
        with:
          path: linux-work
          key: linux-work-${{ hashFiles('amxts/docker/build/**', 'amxts/runtime/patches/wamr-*.patch', 'amxts/runtime/CMakeLists.txt', 'amxts/runtime/src/**') }}
          restore-keys: linux-work-
      # The host plugin first: the module carries it.
      - name: The host plugin
        working-directory: amxts
        run: bun run host
      - name: The Linux module and wamrc
        working-directory: amxts
        env:
          JOBS: 4
          AMXTS_BUILD_VOLUME: ${{ github.workspace }}/linux-work
        run: bun run build:linux $SANITIZE

      - name: The server suites on Linux
        working-directory: amxts
        run: bun run test:server --linux $SANITIZE ${AMXX:+--amxx "$AMXX"}
      - name: The test server's console
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-server-linux${{ matrix.amxx && format('-{0}', matrix.amxx) || '' }}${{ matrix.sanitize && '-sanitize' || '' }}
          path: amxts/dist-wasm/test-server-linux/last-run
          if-no-files-found: ignore

      - name: The Linux server kit
        if: matrix.amxx == '' && !matrix.sanitize
        working-directory: amxts
        run: bun run serverkit --os linux
      - name: The Linux files
        if: matrix.amxx == '' && !matrix.sanitize
        uses: actions/upload-artifact@v7
        with:
          name: amxts-linux
          path: |
            amxts/runtime/build/linux/amxts_amxx_i386.so
            amxts/runtime/build/linux/wamrc
            amxts/dist-server/linux

  # The Windows files: the host plugin, the module that carries it (MSVC,
  # Win32), wamrc.exe against LLVM's prebuilt package and the kit - what a
  # developer's `bun run release:windows` does, on a Windows runner.
  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      LLVM_VERSION: 18.1.8
    steps:
      # The patches apply to LF files: no CRLF in the checkouts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          path: amxts
      - uses: ./amxts/.github/actions/setup

      # Of LLVM's 1 GB package wamrc links only the headers, the LLVM
      # libraries and the CMake package; every other file the package's
      # exports name becomes an empty one, as in docker/build/Dockerfile.
      - name: Cache LLVM
        id: llvm
        uses: actions/cache@v6
        with:
          path: llvm
          key: llvm-${{ env.LLVM_VERSION }}-windows-wamrc
      - name: LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          name="clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc"
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz"
          tar -xJf llvm.tar.xz --wildcards --no-anchored '*/include/*' '*/lib/LLVM*.lib' '*/lib/LTO.lib' '*/lib/Remarks.lib' '*/lib/cmake/llvm/*'
          rm llvm.tar.xz
          mv "$name" llvm
          grep -ho '"${_IMPORT_PREFIX}/[^"]*"' llvm/lib/cmake/llvm/LLVMExports-*.cmake \
            | sed 's|"${_IMPORT_PREFIX}|llvm|; s|"$||' | sort -u \
            | while read -r file; do [ -e "$file" ] || { mkdir -p "$(dirname "$file")"; touch "$file"; }; done

      - name: The patched WAMR
        shell: bash
        working-directory: amxts
        run: |
          git clone -q --depth 1 --branch WAMR-2.4.5 https://github.com/bytecodealliance/wasm-micro-runtime runtime/deps/wamr
          git -C runtime/deps/wamr apply ../../patches/wamr-2.4.5-amxts.patch

      - name: The Windows files
        shell: bash
        working-directory: amxts
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/lib/cmake/llvm
        run: bun run release:windows ${{ startsWith(github.ref, 'refs/tags/v') && '--no-upload' || '--dry-run' }}
      - uses: actions/upload-artifact@v7
        with:
          name: amxts-windows
          path: amxts/dist-release/windows

  # The packages as a user gets them, before any goes out: all nine published
  # to an empty local registry - wamrc from both systems' files above - then a
  # project made with npx create-amxts (menu-core, no server), type-checked,
  # built and tested, and its build run on the server image of the Linux kit
  # (bun run test:release). Only on a tag and by hand, after the Windows files
  # it needs: about 15 minutes, the setup and the packing most of it.
  packages:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: amxts
      - uses: ./amxts/.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: amxts-linux
          path: amxts
      - uses: actions/download-artifact@v8
        with:
          name: amxts-windows
          path: amxts/dist-release/windows
      - name: The Linux files, packed as the release packs them
        working-directory: amxts
        run: bun run release:linux --skip-build --no-upload --dry-run
      # docker/server with the Linux kit, as Publish builds the image: here
      # with the cache of its layers, then taken by name.
      - name: The Linux server kit
        run: |
          mkdir "$RUNNER_TEMP/kit"
          tar -xzf amxts/dist-release/linux/amxts-server-linux-x64.tar.gz -C "$RUNNER_TEMP/kit"
      - uses: docker/setup-buildx-action@v4
      - name: The server image
        uses: docker/build-push-action@v7
        with:
          context: amxts/docker/server
          build-contexts: kit=${{ runner.temp }}/kit
          tags: amxts-release-test
          load: true
          cache-from: type=gha,scope=amxts-server
          cache-to: type=gha,mode=max,scope=amxts-server
      - name: The packages, end to end
        working-directory: amxts
        run: bun run test:release --image amxts-release-test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, tests, linux, windows, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # The draft release and its files.
      contents: write
      # Starting the Publish workflow.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: amxts
      - uses: ./amxts/.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: amxts-linux
          path: amxts
      - uses: actions/download-artifact@v8
        with:
          name: amxts-windows
          path: amxts/dist-release/windows
      - name: Both systems' files on the draft release
        working-directory: amxts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run release:linux --skip-build --no-upload
          bun run release:upload
      # The Publish workflow of the tag: the draft taken off, then the server
      # image. Run by hand with the tag, it does the same.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$GITHUB_REF_NAME"
