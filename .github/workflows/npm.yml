# The npm packages of a release, by npm's trusted publishing: no token - npm
# checks the OIDC token GitHub gives this job against the trusted publisher
# each package names (the repository and the workflow file that calls this
# one) - and with provenance. npm takes a package only from the repository
# its package.json's `repository` names, so each repository that owns
# packages calls this from its own publish.yml with the ones it owns: the
# core (publish.yml here), amxts-cli and each official module.
#
# The core is checked out at the tag, the command and the official modules
# beside it, and `bun run publish:npm` packs all eight as a developer's machine
# does - wamrc from the GitHub Release, the modules compiled for both systems -
# then publishes the ones named. A package that is not the core's waits until
# the core of its version is on npm, so all the tags of a release can be
# pushed at once.
name: npm

on:
  workflow_call:
    inputs:
      tag:
        description: The release's tag, v<version>
        type: string
        required: true
      packages:
        description: The packages to publish, comma-separated
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The core of this version on npm
        if: ${{ !contains(inputs.packages, '@amxts/core') }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for attempt in $(seq 240); do
            [ "$(npm view "@amxts/core@${TAG#v}" version 2>/dev/null)" = "${TAG#v}" ] && exit 0
            sleep 60
          done
          echo "::error::@amxts/core ${TAG#v} is not on npm after 4 hours: publish the core's release, then run this again"
          exit 1

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/amxts
          ref: ${{ inputs.tag }}
          path: amxts
      - uses: ./amxts/.github/actions/setup
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/resemiclip
          path: amxts-modules/resemiclip

      - name: npm 11.5.1 or newer, which publishes with an OIDC token
        run: npm install -g npm@^11.5.1
      - name: Pack all, publish these
        working-directory: amxts
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ inputs.packages }}
        run: bun run publish:npm --only "$PACKAGES"
